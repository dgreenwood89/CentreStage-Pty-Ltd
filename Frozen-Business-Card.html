<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<script src="doc-page.js"></script>
<title>Frozen business card — 90 × 55 mm (+3 mm bleed), two sided</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<template id="__bundler_thumbnail"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#0B1F4F"/><text x="60" y="78" font-family="Arial Black, Arial" font-size="56" font-weight="900" fill="#7FD3FF" text-anchor="middle">/</text></svg></template>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1B2330; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  doc-page section.page { padding: 0; }
  * { animation-delay: -99s !important; animation-duration: .001s !important; animation-iteration-count: 1 !important; animation-fill-mode: both !important; transition-duration: 0s !important; }
  .card { width: 96mm; height: 61mm; position: relative; overflow: hidden; background: #0B1F4F; color: #FFFFFF; font-family: 'Source Sans 3', Arial, sans-serif; }
  .bebas { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-weight: 400; line-height: .95; }
  /* front */
  .front .art { position: absolute; left: 0; top: 0; bottom: 0; width: 60mm; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 62%, transparent 100%); mask-image: linear-gradient(90deg, #000 62%, transparent 100%); }
  .front .art img { position: absolute; left: -22mm; top: -6mm; height: 73mm; width: auto; display: block; }
  .front .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,31,79,0) 55%, rgba(11,31,79,.6) 100%); }
  .front .cs { position: absolute; top: 7mm; right: 7mm; display: flex; flex-direction: column; align-items: center; gap: .9mm; }
  .front .cs img { width: 17mm; height: auto; display: block; }
  .front .cs span { font-family: Arial, sans-serif; font-weight: 700; font-size: 1.5mm; letter-spacing: .28em; text-transform: uppercase; white-space: nowrap; }
  .front .info { position: absolute; left: 38mm; right: 6mm; bottom: 8mm; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .front .logo { width: 52mm; height: auto; display: block; }
  .front .dates { font-size: 5.6mm; letter-spacing: .02em; margin-top: 1.6mm; white-space: nowrap; }
  .front .venue { font-size: 2.2mm; letter-spacing: .1em; color: #8FCBF2; margin-top: .6mm; white-space: nowrap; }
  /* back */
  .back { background: radial-gradient(ellipse 90% 80% at 30% 30%, #183A7A 0%, #0B1F4F 55%, #071533 100%); }
  .back .icicles { position: absolute; top: 0; left: 0; right: 0; height: 26mm; pointer-events: none; background: url(assets/frozen/aurora-band-slim-lite.png) top center/100% 100% no-repeat; opacity: .9; -webkit-mask-image: linear-gradient(180deg,#000 0%,#000 50%,transparent 100%); mask-image: linear-gradient(180deg,#000 0%,#000 50%,transparent 100%); }
  .back .frost { position: absolute; width: 52mm; height: 52mm; right: -16mm; bottom: -18mm; pointer-events: none; background: url(assets/frozen/filigree-lite.png) center/contain no-repeat; opacity: .22; }
  .back .wrap { position: absolute; left: 7mm; right: 7mm; top: 14mm; bottom: 7mm; display: flex; align-items: center; gap: 6mm; }
  .back .qr { width: 30mm; height: 30mm; background: #FFFFFF; padding: 1.6mm; flex: none; }
  .back .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .back .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .back .cta { font-size: 9mm; letter-spacing: .02em; }
  .back .sub { font-size: 2.6mm; line-height: 1.4; color: #C9D8EE; margin-top: 1mm; }
  .back .url { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 3.6mm; letter-spacing: .04em; color: #8FCBF2; margin-top: 2.4mm; }
  .back .lic { position: absolute; left: 7mm; right: 7mm; bottom: 4.6mm; font-size: 1.5mm; line-height: 1.3; color: #A9C0E0; }
</style>
</head>
<body>
<doc-page width="96mm" height="61mm" margin="0">
  <section class="page card front" data-screen-label="Business card — front">
    <div class="art"><img src="assets/frozen-banner-art.png" alt=""></div>
    <div class="shade"></div>
    <div class="cs"><img src="assets/CentreStage-Solid-White.png" alt="CentreStage"><span>Production of</span></div>
    <div class="info">
      <img class="logo" src="assets/frozen-title-dark.png" alt="Frozen">
      <div class="bebas dates">5 — 20 March 2027</div>
      <div class="bebas venue">The Playhouse · Geelong Arts Centre</div>
    </div>
  </section>

  <section class="page card back" data-screen-label="Business card — back">
    <div class="icicles"></div>
    <div class="frost"></div>
    <div class="wrap">
      <div class="qr"><img src="assets/qr-frozen-tickets.png" alt="Scan to book Frozen tickets"></div>
      <div class="txt">
        <div class="bebas cta">Scan to book</div>
        <div class="sub">Fifteen performances only. Tickets on sale now.</div>
        <div class="url">geelongartscentre.org.au</div>
      </div>
    </div>
    <div class="lic">Licensed exclusively by Music Theatre International (Australasia). www.mtishows.com.au</div>
  </section>
</doc-page>
</body>
</html>
