<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Frozen fridge magnet — 87 × 49 mm (+3 mm bleed)</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<template id="__bundler_thumbnail"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#0B1F4F"/><text x="60" y="78" font-family="Arial Black, Arial" font-size="56" font-weight="900" fill="#7FD3FF" text-anchor="middle">/</text></svg></template>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1B2330; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .mag { width: 93mm; height: 55mm; position: relative; overflow: hidden; background: #0B1F4F; color: #FFFFFF; font-family: 'Source Sans 3', Arial, sans-serif; }
  .art { position: absolute; left: 0; top: 0; width: 64mm; height: 100%; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent 100%); mask-image: linear-gradient(90deg, #000 45%, transparent 100%); }
  .art img { position: absolute; left: -4mm; top: -6mm; height: 72mm; width: auto; display: block; opacity: .55; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,31,79,.15) 0%, rgba(11,31,79,.55) 100%); }
  .info { position: absolute; left: 7mm; top: 7mm; bottom: 7mm; width: 50mm; display: flex; flex-direction: column; }
  .cs { display: flex; align-items: center; gap: 1.6mm; }
  .cs img { width: 16mm; height: auto; display: block; }
  .cs span { font-family: Arial, sans-serif; font-weight: 700; font-size: 1.6mm; letter-spacing: .28em; text-transform: uppercase; white-space: nowrap; }
  .logo { width: 44mm; height: auto; display: block; margin-top: 3mm; }
  .bebas { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-weight: 400; line-height: .95; }
  .dates { font-size: 6.6mm; letter-spacing: .02em; margin-top: auto; white-space: nowrap; }
  .venue { font-size: 2.9mm; letter-spacing: .14em; color: #8FCBF2; margin-top: .8mm; white-space: nowrap; }
  .lic { font-size: 1.45mm; line-height: 1.3; color: #C9D8EE; margin-top: 1.6mm; }
  .qr { position: absolute; right: 7mm; top: 7mm; bottom: 7mm; width: 27mm; background: #FFFFFF; color: #0B1F4F; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2mm; gap: 1.2mm; }
  .qr img { width: 23mm; height: 23mm; display: block; image-rendering: pixelated; }
  .qr .cta { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-size: 4.6mm; letter-spacing: .06em; line-height: 1; }
  .qr .sub { font-size: 1.55mm; font-weight: 600; letter-spacing: .04em; text-align: center; line-height: 1.25; color: #2A4A7A; }
</style>
</head>
<body>
<main style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px;">
  <section class="page mag" data-screen-label="Fridge magnet">
    <div class="art"><img src="assets/frozen-banner-art.png" alt=""></div>
    <div class="shade"></div>
    <div class="info">
      <div class="cs"><img src="assets/CentreStage-Solid-White.png" alt="CentreStage"><span>Production of</span></div>
      <img class="logo" src="assets/frozen-title-dark.png" alt="Frozen">
      <div class="bebas dates">5 — 20 March 2027</div>
      <div class="bebas venue">The Playhouse · Geelong Arts Centre</div>
      <div class="lic">Licensed exclusively by Music Theatre International (Australasia). www.mtishows.com.au</div>
    </div>
    <div class="qr">
      <img src="assets/qr-frozen-tickets.png" alt="Scan to book Frozen tickets">
      <div class="cta">Scan to book</div>
      <div class="sub">geelongartscentre.org.au</div>
    </div>
  </section>
</main>
</body>
</html>
