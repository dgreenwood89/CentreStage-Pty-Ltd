<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Frozen roadside sign — 1000 × 1000 mm (+5 mm bleed)</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<template id="__bundler_thumbnail"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="#0B1F4F"/><text x="60" y="78" font-family="Arial Black, Arial" font-size="56" font-weight="900" fill="#7FD3FF" text-anchor="middle">/</text></svg></template>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #1B2330; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sign { width: 1010mm; height: 1010mm; position: relative; overflow: hidden; background: #0B1F4F; color: #FFFFFF; font-family: 'Source Sans 3', Arial, sans-serif; }
  .art { position: absolute; left: 0; top: 0; width: 100%; height: 560mm; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent 100%); mask-image: linear-gradient(180deg, #000 60%, transparent 100%); }
  .art img { position: absolute; left: 0; top: -215mm; width: 1010mm; height: auto; display: block; }
  .edge { position: absolute; top: 0; right: 0; width: 420mm; height: 560mm; background: linear-gradient(90deg, rgba(11,31,79,0) 0%, rgba(11,31,79,.75) 100%); }
  .cs { position: absolute; top: 48mm; right: 50mm; display: flex; flex-direction: column; align-items: center; gap: 7mm; }
  .cs img { width: 150mm; height: auto; display: block; }
  .cs span { font-family: Arial, sans-serif; font-weight: 700; font-size: 11mm; letter-spacing: .32em; text-transform: uppercase; white-space: nowrap; }
  .info { position: absolute; left: 50mm; right: 50mm; top: 440mm; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .logo { width: 620mm; height: auto; display: block; }
  .bebas { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; font-weight: 400; line-height: .95; }
  .dates { font-size: 120mm; letter-spacing: .01em; margin-top: 20mm; white-space: nowrap; }
  .venue { font-size: 38mm; letter-spacing: .14em; color: #8FCBF2; margin-top: 4mm; white-space: nowrap; }
  .url { font-size: 74mm; letter-spacing: .005em; margin-top: 18mm; white-space: nowrap; }
  .lic { position: absolute; left: 50mm; right: 50mm; bottom: 30mm; text-align: center; font-size: 13mm; line-height: 1.35; color: #DCE8F7; }
</style>
</head>
<body>
<doc-page width="1010mm" height="1010mm">
  <section class="page sign" data-screen-label="Roadside sign">
    <div class="art"><img src="assets/frozen-elsa-hires.jpg" alt=""></div>
    <div class="edge"></div>
    <div class="cs">
      <img src="assets/CentreStage-Solid-White.png" alt="CentreStage">
      <span>Production of</span>
    </div>
    <div class="info">
      <img class="logo" src="assets/frozen-title-dark.png" alt="Frozen">
      <div class="bebas dates">5 — 20 March 2027</div>
      <div class="bebas venue">The Playhouse · Geelong Arts Centre</div>
      <div class="bebas url">geelongartscentre.org.au</div>
    </div>
    <div class="lic">Licensed exclusively by Music Theatre International (Australasia). www.mtishows.com.au</div>
  </section>
</doc-page>
<script src="doc-page.js"></script>
</body>
</html>
