<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#3A3A37; }
</style>
</helmet>

<div style="width:1080px; height:1920px; background:#0A0A0A; color:#F4F1EA; font-family:Arial,Helvetica,sans-serif; position:relative; overflow:hidden; display:flex; flex-direction:column;">

  <div style="position:absolute; top:-180px; right:-220px; width:760px; height:760px; border-radius:50%; background:radial-gradient(circle, rgba(232,71,43,.22) 0%, rgba(232,71,43,0) 68%);"></div>

  <div style="position:relative; padding:72px 72px 0; display:flex; align-items:flex-start; justify-content:space-between;">
    <img src="assets/CentreStage-Solid-White.png" alt="CentreStage" style="height:38px; width:auto; display:block;">
    <span style="font-family:'JetBrains Mono',monospace; font-size:16px; letter-spacing:.28em; text-transform:uppercase; color:#6B6B68; padding-top:8px;">2026 Education Season</span>
  </div>

  <div style="position:relative; padding:56px 72px 0;">
    <span style="display:inline-block; font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:#E8472B;">Ticket update</span>
    <h1 style="font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:132px; letter-spacing:-.04em; line-height:.86; margin:26px 0 0; text-wrap:balance;">Selling<br>fast.</h1>
    <div style="height:2px; background:#F4F1EA; margin:48px 0 0;"></div>
  </div>

  <div style="position:relative; padding:0 72px; flex:1; display:flex; flex-direction:column; justify-content:center;">

    <div style="display:flex; align-items:center; gap:40px; padding:44px 0; border-bottom:1px solid #1F1F1D;">
      <img src="assets/shows/pooh.png" alt="Disney's Winnie the Pooh Kids" style="width:250px; height:auto; display:block; flex-shrink:0;">
      <div style="flex:1; display:flex; flex-direction:column; gap:10px; align-items:flex-end; text-align:right;">
        <span style="font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:44px; letter-spacing:-.02em; line-height:1; color:#E8472B;">SOLD OUT</span>
        <span style="font-family:'JetBrains Mono',monospace; font-size:17px; letter-spacing:.06em; color:#6B6B68;">Every performance</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:40px; padding:44px 0; border-bottom:1px solid #1F1F1D;">
      <img src="assets/shows/matilda.png" alt="Roald Dahl's Matilda Jr" style="width:250px; height:auto; display:block; flex-shrink:0;">
      <div style="flex:1; display:flex; flex-direction:column; gap:10px; align-items:flex-end; text-align:right;">
        <span style="font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:36px; letter-spacing:-.02em; line-height:1.05; color:#E8472B;">TROUPES B &amp; C SOLD OUT</span>
        <span style="font-family:'JetBrains Mono',monospace; font-size:17px; letter-spacing:.06em; color:#F4F1EA;">Troupe A &middot; a handful of seats left</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:40px; padding:44px 0; border-bottom:1px solid #1F1F1D;">
      <img src="assets/shows/hadestown.png" alt="Hadestown Teen Edition" style="width:250px; height:auto; display:block; flex-shrink:0;">
      <div style="flex:1; display:flex; flex-direction:column; gap:10px; align-items:flex-end; text-align:right;">
        <span style="font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:44px; letter-spacing:-.02em; line-height:1; color:#F4F1EA;">ON SALE NOW</span>
        <span style="font-family:'JetBrains Mono',monospace; font-size:17px; letter-spacing:.06em; color:#6B6B68;">Good availability</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:40px; padding:44px 0;">
      <img src="assets/shows/broadway.png" alt="Broadway Rocks!" style="width:250px; height:auto; display:block; flex-shrink:0;">
      <div style="flex:1; display:flex; flex-direction:column; gap:10px; align-items:flex-end; text-align:right;">
        <span style="font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:44px; letter-spacing:-.02em; line-height:1; color:#F4F1EA;">COMING SOON</span>
        <span style="font-family:'JetBrains Mono',monospace; font-size:17px; letter-spacing:.06em; color:#6B6B68;">On sale Thursday 27 August</span>
      </div>
    </div>

  </div>

  <div style="position:relative; background:#F4F1EA; color:#0A0A0A; padding:44px 72px; display:flex; align-items:center; justify-content:space-between; gap:24px;">
    <span style="font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:38px; letter-spacing:-.025em;">Book now</span>
    <span style="font-family:'JetBrains Mono',monospace; font-size:22px; letter-spacing:.08em;">centrestage.org.au</span>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920}}"></script>
</body>
</html>
